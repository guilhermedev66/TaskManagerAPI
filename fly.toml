# fly.toml app configuration file generated for taskmanagerapi-guilherme on 2026-08-18T15:14:07-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'taskmanagerapi-guilherme'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  ConnectionStrings__DefaultConnection = 'Data Source=/app/data/taskmanager.db'
  Jwt__Issuer = 'TaskManagerAPI'
  Jwt__Audience = 'TaskManagerAPIUsers'
  Jwt__ExpiresInMinutes = '60'
  Jwt__RefreshTokenExpiresInDays = '7'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health/ready'
    protocol = 'http'

[[mounts]]
  source = 'taskmanager_data'
  destination = '/app/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
