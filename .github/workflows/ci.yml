name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore TaskManagerAPI.Tests/TaskManagerAPI.Tests.csproj

      - name: Build
        run: dotnet build TaskManagerAPI.Tests/TaskManagerAPI.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test TaskManagerAPI.Tests/TaskManagerAPI.Tests.csproj --configuration Release --no-build --verbosity normal
